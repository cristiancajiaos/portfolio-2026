<section class="certificates-page">
  @if (certificateResource.isLoading()) {
    <app-loading/>
  }
  @if (certificateResource.hasValue()) {
    <ul class="list bg-base-100 rounded-box shadow-md mt-4">
      @for (certificate of certificateResource.value(); track certificate.id) {
      <app-single-certificate [certificate]="certificate"/>
    }
    </ul>

  }
</section>
